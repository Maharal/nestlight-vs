name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# a new push to the same PR cancels the run in progress
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # the tests target net48, which needs Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test NestLight.Tests/NestLight.Tests.csproj --configuration Release
