<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="NestLight" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1e2e"/>
      <stop offset="1" stop-color="#0f111a"/>
    </linearGradient>
    <linearGradient id="outer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b7bff"/>
      <stop offset="1" stop-color="#6a4cff"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4be3f2"/>
      <stop offset="1" stop-color="#1fb6d6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffb938" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffb938" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- fundo -->
  <rect width="128" height="128" rx="26" fill="url(#bg)"/>

  <!-- camada externa: chaves { } -->
  <g fill="none" stroke="url(#outer)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 22 C28 22 28 29 28 39 V52 C28 58 24 64 16 64 C24 64 28 70 28 76 V89 C28 99 28 106 40 106"/>
    <path d="M88 22 C100 22 100 29 100 39 V52 C100 58 104 64 112 64 C104 64 100 70 100 76 V89 C100 99 100 106 88 106"/>
  </g>

  <!-- camada do meio: < > -->
  <g fill="none" stroke="url(#mid)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 46 L36 64 L52 82"/>
    <path d="M76 46 L92 64 L76 82"/>
  </g>

  <!-- luz no centro -->
  <circle cx="64" cy="64" r="20" fill="url(#glow)"/>
  <circle cx="64" cy="64" r="6" fill="#ffd36b"/>
  <circle cx="64" cy="64" r="2.6" fill="#fff6d8"/>
</svg>
